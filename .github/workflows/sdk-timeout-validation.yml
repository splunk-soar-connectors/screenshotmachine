name: Validate SDK package install timeout

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  sdk-timeout-validation:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:6abbbe275a28d5b8bf18d3384a19aa68e9c242d0
    steps:
      - name: Check out Screenshot Machine PR #34
        uses: actions/checkout@v4
        with:
          repository: splunk-soar-connectors/screenshotmachine
          ref: 0a42c10475947523ce97296125eb6bd7d0531bb6
          path: app
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Build Screenshot Machine with locked dependencies
        run: |
          cd app
          uv sync --locked
          uv run soarapps package build .
        shell: bash

      - name: Install the SDK PR commit into the CLI environment
        run: >-
          uv pip install --python app/.venv/bin/python
          "splunk-soar-sdk @ git+https://github.com/phantomcyber/splunk-soar-sdk.git@66ee357"
        shell: bash

      - name: Install package on SOAR instances with the SDK PR CLI
        env:
          CURRENT_PHANTOM_IP: ${{ vars.PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
          NEXT_PHANTOM_IP: ${{ vars.PHANTOM_INSTANCE_NEXT_OL8_VERSION_IP }}
          PREVIOUS_PHANTOM_IP: ${{ vars.PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
          PHANTOM_USERNAME: ${{ vars.PHANTOM_USERNAME }}
          PHANTOM_PASSWORD: password
        run: |
          TARBALL=$(find app -maxdepth 1 -name '*.tgz' -print -quit)
          if [[ -z "$TARBALL" ]]; then
            echo "No Screenshot Machine package tarball was built" >&2
            exit 1
          fi

          for instance in "$CURRENT_PHANTOM_IP" "$NEXT_PHANTOM_IP" "$PREVIOUS_PHANTOM_IP"; do
            app/.venv/bin/soarapps package install "$TARBALL" "$instance" \
              --username "$PHANTOM_USERNAME" --insecure --force
          done
        shell: bash
