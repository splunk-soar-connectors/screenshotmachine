name: Validate SDK package install timeout

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  sdk-timeout-validation:
    runs-on:
      - codebuild-integration-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - image:custom-linux-875003031410.dkr.ecr.us-west-2.amazonaws.com/soar-connectors/pytest:6abbbe275a28d5b8bf18d3384a19aa68e9c242d0
    steps:
      - name: Check out Screenshot Machine PR #34
        uses: actions/checkout@v4
        with:
          repository: splunk-soar-connectors/screenshotmachine
          ref: 0a42c10475947523ce97296125eb6bd7d0531bb6
          path: app
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Pin the SDK PR commit and install the locked app environment
        run: |
          cd app
          uv add "splunk-soar-sdk @ git+https://github.com/phantomcyber/splunk-soar-sdk.git@66ee357"
          uv lock
          uv sync --locked
        shell: bash

      - name: Build and install app on SOAR instances
        uses: splunk-soar-connectors/.github/.github/actions/compile-app@codex/defender-ttl-ci
        with:
          current_phantom_ip: ${{ vars.PHANTOM_INSTANCE_CURRENT_VERSION_IP }}
          next_phantom_ip: ${{ vars.PHANTOM_INSTANCE_NEXT_OL8_VERSION_IP }}
          previous_phantom_ip: ${{ vars.PHANTOM_INSTANCE_PREVIOUS_VERSION_IP }}
          phantom_username: ${{ vars.PHANTOM_USERNAME }}
          phantom_password: password
          is_sdkfied: 'true'
          uv_lock_directory: app
          insecure_sdk_install: 'true'
          force_sdk_install: 'true'
